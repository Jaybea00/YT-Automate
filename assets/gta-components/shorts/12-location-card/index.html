<!doctype html>
<!-- GTA 6 component #12 — Location card (craft v2, round 4). 1080x1920 (9:16), 30 fps.
     Variables: variant "0" Official wide caps / "1" Pin pill; bg "plate" (sample footage) / "none" (transparent overlay).
     v0: VICE / CITY stacked huge in the sky of a Vice City montage, left on its ink edge; it locks on the cut to the skyline
         with an exposure hit and grows Rockstar's #EE08F2 date-card edge, then ticks on every later cut.
     v1: a solid ink location pill (the in-game pill, at title scale) is pinned into the marina by its needle, then pulls the
         pin and rides the edit through the Keys at 1.0x until the real "Welcome to The Keys" sign takes over.
     Safe zones: all text inside x 72–936, y 230–1480. -->
<html lang="en" data-composition-variables='[
  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"Official wide caps"},{"value":"1","label":"Pin pill"}]},
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/kit/look/look.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: #fff;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #v1c { filter: contrast(1.14) saturate(1.18) brightness(1.04); } /* the boat-wheel insert is soft and muted: give it some snap */
      #ov { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
      .hide { display: none !important; }

      /* ================= v0 · Official wide caps ================= */
      #scrim0 { position: absolute; left: 0; right: 0; top: 0; height: 760px;
        background: linear-gradient(180deg, rgba(8,6,16,1) 0%, rgba(8,6,16,.86) 34%, rgba(8,6,16,.52) 62%, rgba(8,6,16,.18) 84%, rgba(8,6,16,0) 100%); }
      #lock { position: absolute; inset: 0; }
      #kick { position: absolute; left: 0; top: 0; font-size: 26px; line-height: 1; letter-spacing: .42em; white-space: nowrap; color: #fff;
        text-shadow: 0 2px 14px rgba(0,0,0,.55); }
      .hl { position: absolute; left: 0; top: 0; font-family: "Archivo", "Inter", sans-serif; font-stretch: 125%; font-weight: 800;
        text-transform: uppercase; white-space: nowrap; color: #fff; }
      .hl .ch { display: inline-block; white-space: pre; }
      #coords0 { position: absolute; left: 0; top: 0; font-size: 26px; line-height: 1; letter-spacing: .12em; white-space: pre; color: #fff;
        text-shadow: 0 2px 14px rgba(0,0,0,.55); }

      /* ================= v1 · Pin pill ================= */
      #pinRig { position: absolute; inset: 0; }
      #needle { position: absolute; left: 0; top: 0; width: 6px; border-radius: 3px; transform-origin: 50% 0%;
        background: linear-gradient(90deg, #b9bdc9 0%, #ffffff 42%, #e9ebf1 60%, #9da1ae 100%);
        box-shadow: 0 0 0 1px rgba(0,0,0,.14), 4px 6px 10px rgba(0,0,0,.42); }
      #tip { position: absolute; left: 0; top: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #FE78A6 0%, #F84FA4 55%, #c8287e 100%);
        box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.55); }
      #contact { position: absolute; left: 0; top: 0; width: 70px; height: 18px; margin: -6px 0 0 -35px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
      #pillBox { position: absolute; left: 0; top: 0; }
      #pinner { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; }
      #pill { position: relative; overflow: hidden;
        background: linear-gradient(180deg, #2A2B38 0%, #1F202B 52%, #1A1B24 100%);
        border: 1px solid rgba(255,255,255,.06);
        box-shadow: inset 0 1.5px 0 rgba(255,255,255,.26), inset 0 -1px 0 rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.28), 0 30px 60px -20px rgba(0,0,0,.7); }
      #pedge { position: absolute; left: 70px; right: 70px; top: 0; height: 2px; opacity: .55;
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.95) 22%, rgba(255,255,255,.95) 78%, rgba(255,255,255,0));
        box-shadow: 0 0 14px 2px rgba(255,255,255,.35); }
      #pmask { position: relative; overflow: hidden; padding: 18px 14px; margin: -18px -14px; }
      #pname { font-family: "Inter", sans-serif; font-weight: 800; letter-spacing: -0.045em; line-height: 1; white-space: nowrap;
        font-optical-sizing: auto; color: #fff; }
      #pcoords { position: absolute; left: 0; top: 0; font-size: 28px; font-weight: 600; line-height: 1; letter-spacing: .2em; white-space: pre; color: #fff;
        text-shadow: 0 0 1px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.55), 0 2px 14px rgba(0,0,0,.6), 0 4px 30px rgba(0,0,0,.35); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="shake"><div id="push">
        <!-- v0: Vice City montage, cut on the graphic's beats, all at 1.0x -->
        <video id="v0a" class="clip shot v0s" src="assets/shots/s011-vice-highway-v.mp4" muted playsinline data-start="0" data-duration="0.95" data-media-start="0" data-track-index="0"></video>
        <video id="v0b" class="clip shot v0s" src="assets/shots/s135-skydive-city-v.mp4" muted playsinline data-start="0.95" data-duration="1.6" data-media-start="0" data-track-index="0"></video>
        <video id="v0c" class="clip shot v0s" src="assets/shots/s100-biplane-beach-v.mp4" muted playsinline data-start="2.55" data-duration="0.9" data-media-start="0.85" data-track-index="0"></video>
        <video id="v0d" class="clip shot v0s" src="assets/shots/s026-sunset-pier-v.mp4" muted playsinline data-start="3.45" data-duration="1.55" data-media-start="0" data-track-index="0"></video>
        <!-- v1: the Keys, all at 1.0x: marina (pin plant) -> jetski (hit) -> boat wheel -> Welcome to The Keys sign -->
        <video id="v1a" class="clip shot v1s" src="assets/shots/s075-marina-aerial-v.mp4" muted playsinline data-start="0" data-duration="1.78" data-media-start="0" data-track-index="1"></video>
        <video id="v1b" class="clip shot v1s" src="assets/shots/s064-jetski-v.mp4" muted playsinline data-start="1.78" data-duration="0.7" data-media-start="0" data-track-index="1"></video>
        <video id="v1c" class="clip shot v1s" src="assets/shots/s076-jason-boat-v.mp4" muted playsinline data-start="2.48" data-duration="0.82" data-media-start="0.05" data-track-index="1"></video>
        <video id="v1d" class="clip shot v1s" src="assets/shots/s074-keys-sign-v.mp4" muted playsinline data-start="3.3" data-duration="1.7" data-media-start="0" data-track-index="1"></video>
      </div></div>

      <div id="ov" class="clip" data-start="0" data-duration="5" data-track-index="2">
        <!-- v0 lockup -->
        <div id="scrim0" class="hide"></div>
        <div id="lock" class="hide">
          <div id="kick" class="t-label-wide"></div>
          <div class="hl" id="hl0"></div>
          <div class="hl" id="hl1"></div>
          <div id="coords0" class="t-mono t-num"></div>
        </div>
        <!-- v1 pin + pill (screen space; the pin tip is tracked to the footage) -->
        <div id="pinRig" class="hide">
          <div id="contact"></div>
          <div id="needle"></div>
          <div id="tip"></div>
          <div id="pillBox"><div id="pill"><div id="pinner"><div id="pedge"></div><div id="pmask"><div id="pname"></div></div></div></div></div>
          <div id="pcoords" class="t-mono t-num"></div>
        </div>
      </div>
    </div>

    <script>
      const CONFIG = {
        variants: {
          // Official wide caps: Rockstar's date-card language at title scale. VICE / CITY stacked in the sky, left on its ink
          // edge; it locks on the cut to the skyline and grows the #EE08F2 edge + bloom (the one accent).
          "0": {
            style: "official",
            kicker: "Now entering · Leonida",   // region lives in the kicker
            lines: ["Vice", "City"],             // the place name, one word per line (deliberate stack)
            lat: 25.76, lon: -80.19              // real-world analogue (Miami); any numbers work
          },
          // Pin pill: the in-game location pill as a solid ink object at title scale, pinned into the shot by its needle.
          "1": {
            style: "pin",
            name: "Leonida Keys",
            lat: 24.67, lon: -81.54              // real-world analogue (Florida Keys)
          }
        },
        layout: {
          v0: {
            inkX: 96,                  // every line's visible ink edge sits on this column
            kickCap: 236,              // y of the kicker's cap top (the stack must clear the skydiver's head in s135)
            kickGap: 22,               // kicker baseline -> hero cap top
            heroMax: 204, heroMin: 150, // hero px: the largest size whose widest line + the coords tag fit inside x 96–928
            lineHeight: 0.83,          // VICE / CITY pitch, in em
            track: [0.10, 0.02],       // hero tracking (em) at the start of the entrance -> locked on the hit
            coordsGap: 34,             // CITY ink edge -> coords tag (two mono lines, last baseline on CITY's baseline)
            coordsLead: 34,            // coords line pitch (px)
            scrim: { height: 760, peak: 0.45 }, scrimOverlay: { height: 640, peak: 0.36 }
          },
          v1: {
            pillX: 72, pillW: 864, pillH: 210,   // the pill spans the safe width
            pillTopFinal: 246,         // where the pill parks after the pin is pulled (in the sky / above every subject)
            nameSize: 140, nameInkMax: 760,      // name px (fit-down only if a longer name would overflow the pill)
            coordsGap: 24,             // pill bottom -> coords cap top; coords right-aligned to the pill's inner edge
            // The planted point (px, footage space) tracked from s075 with ffmpeg find_rect, [t, x, y] at 1.0x.
            // The tip sits on the boat-barn roof between the "'S" and the "M" of the marina sign. bg:"none" uses the first point.
            anchorOffset: [-8, 182], trackZoom: 0.09,
            track: [[0.0,240.0,608.7],[0.06,239.8,608.2],[0.12,239.4,607.8],[0.18,239.0,606.8],[0.24,238.4,605.8],[0.3,237.8,605.4],[0.36,237.6,605.2],[0.42,238.0,605.0],[0.48,238.4,604.8],[0.54,238.8,604.4],[0.6,238.8,603.6],[0.66,238.4,602.0],[0.72,237.4,600.0],[0.78,236.2,597.4],[0.84,235.0,594.2],[0.9,233.8,590.2],[0.96,232.6,585.6],[1.02,231.4,580.4],[1.08,230.0,574.4],[1.14,228.6,568.0],[1.2,227.2,561.2],[1.26,225.6,554.0],[1.32,223.8,546.4],[1.38,221.8,538.6],[1.44,219.6,530.4],[1.5,217.2,522.0],[1.56,214.6,513.4],[1.62,212.0,504.8],[1.68,209.4,496.8],[1.74,208.0,492.8],[1.8,206.7,488.7]],
            push: { to: 1.04, origin: [540, 864] }   // s075's push (origin 50% 45%), mirrored when projecting the tip to screen
          }
        },
        timing: {
          // v0
          end0: 5.0, cuts0: [0.95, 2.55, 3.45], heroIn: 0.16, out0: 4.45,      // the hit lands on cuts0[0]
          // v1
          end1: 5.0, cuts1: [1.78, 2.48, 3.3], open: 0.06, plant: 0.42, pull: 1.56, out1: 4.25   // the hit lands on cuts1[0]
        }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const plate = VARS.bg !== "none";
        const V = CONFIG.variants[vKey], T = CONFIG.timing;
        const isV0 = V.style === "official";
        const D = isV0 ? T.end0 : T.end1;
        const $ = (s) => document.querySelector(s);
        const own = isV0 ? ".v0s" : ".v1s";
        document.querySelectorAll("video.shot").forEach((v) => { if (!plate || !v.matches(own)) v.style.display = "none"; });

        const fmtLat = (v) => Math.abs(v).toFixed(2) + "° " + (v >= 0 ? "N" : "S");
        const fmtLon = (v) => Math.abs(v).toFixed(2) + "° " + (v >= 0 ? "E" : "W");
        const coordText = (p, sep) => fmtLat(V.lat + (1 - p) * 0.8) + sep + fmtLon(V.lon - (1 - p) * 1.1);

        // ink metrics from canvas (side bearings + baseline), so every line aligns on its visible ink, not its box
        const cx = document.createElement("canvas").getContext("2d");
        const ink = (text, px, family, weight, stretch, lsPx) => {
          cx.font = weight + " " + px + "px " + family;
          if ("fontStretch" in cx) cx.fontStretch = stretch || "normal";
          if ("letterSpacing" in cx) cx.letterSpacing = (lsPx || 0) + "px";
          const m = cx.measureText(text);
          return { w: m.width, l: -m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight, asc: m.actualBoundingBoxAscent, fa: m.fontBoundingBoxAscent, fd: m.fontBoundingBoxDescent };
        };
        // top of an element (line-height lh px) whose baseline should sit at y
        const topForBaseline = (y, lh, m) => y - ((lh - (m.fa + m.fd)) / 2 + m.fa);

        const fontLoads = ['expanded 800 100px "Archivo"', 'expanded 600 26px "Archivo"', '500 26px "JetBrains Mono"', '800 140px "Inter"']
          .map((f) => document.fonts.load(f).catch(() => null));
        Promise.all(fontLoads).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          const ft = (el, from, to, at) => tl.fromTo(el, from, Object.assign({ immediateRender: false }, to), at);
          const EXPO = gsap.parseEase("expo.out");

          if (isV0) {
            /* ======================= v0 · Official wide caps ======================= */
            const L = CONFIG.layout.v0;
            const lock = $("#lock"), scrim = $("#scrim0"), kick = $("#kick"), coords = $("#coords0");
            const lines = [$("#hl0"), $("#hl1")];
            lock.classList.remove("hide"); scrim.classList.remove("hide");
            const sc = plate ? L.scrim : L.scrimOverlay;
            scrim.style.height = sc.height + "px";

            // ---- size: the largest hero (<= heroMax) whose widest line fits heroInkMax at the locked tracking
            const tr0 = L.track[0], tr1 = L.track[1];
            const words = V.lines.map((w) => w.toUpperCase());
            let wMax = 0;
            words.forEach((w) => { const m = ink(w, 100, '"Archivo"', 800, "expanded", tr1 * 100); wMax = Math.max(wMax, m.r - m.l); });
            const cTag = ink("00.00° N", 26, '"JetBrains Mono"', 500, "normal", 0.12 * 26);
            const roomForHero = 928 - L.inkX - L.coordsGap - (cTag.r - cTag.l);
            const size = Math.max(L.heroMin, Math.min(L.heroMax, Math.floor(100 * roomForHero / wMax)));
            const LH = Math.round(size * L.lineHeight);

            // ---- kicker: cap top at kickCap, ink on the column
            kick.textContent = V.kicker;
            const km = ink(V.kicker.toUpperCase(), 26, '"Archivo"', 600, "expanded", 0.42 * 26);
            const kBase = L.kickCap + km.asc;
            kick.style.top = topForBaseline(kBase, 26, km).toFixed(1) + "px";
            kick.style.left = (L.inkX - km.l).toFixed(1) + "px";

            // ---- hero lines: one span per character (tracking + centre-out resolve), ink edge on the column
            const allChars = [], lineChars = [], lineInk = [];
            let base = 0;
            words.forEach((w, i) => {
              const el = lines[i];
              el.style.fontSize = size + "px"; el.style.lineHeight = LH + "px";
              const chars = Array.from(w).map((c) => { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; el.appendChild(s); allChars.push(s); return s; });
              lineChars.push(chars);
              const m = ink(w, size, '"Archivo"', 800, "expanded", tr1 * size);
              lineInk.push(m);
              base = i === 0 ? kBase + L.kickGap + m.asc : base + LH;
              el.style.top = topForBaseline(base, LH, m).toFixed(1) + "px";
              el.style.left = (L.inkX - m.l).toFixed(1) + "px";
            });
            const lastInk = lineInk[lineInk.length - 1];
            const cityRight = L.inkX - lastInk.l + lastInk.r;     // visible right edge of the last line (at the locked tracking)

            // ---- coords: a two-line mono tag in the sky right of CITY, its last baseline on CITY's baseline
            coords.textContent = coordText(1, "\n");
            coords.style.lineHeight = L.coordsLead + "px";
            const cm = ink(fmtLat(V.lat), 26, '"JetBrains Mono"', 500, "normal", 0.12 * 26);
            coords.style.top = topForBaseline(base - L.coordsLead, L.coordsLead, cm).toFixed(1) + "px";
            coords.style.left = (cityRight + L.coordsGap - cm.l).toFixed(1) + "px";

            const setTrack = (em) => lines.forEach((el) => { el.style.letterSpacing = em + "em"; });
            const SH_LIFT = "0px 4px 26px rgba(0,0,0,0.42)";
            const magenta = (p) => { // Rockstar date-card edge: hard #EE08F2 offset + soft bloom, grown on the hit
              const off = (4 * p).toFixed(2);
              const v = off + "px 0px 0px rgba(238,8,242," + p.toFixed(3) + "), 0px 0px 30px rgba(238,8,242," + (0.36 * p).toFixed(3) + "), 0px 0px 90px rgba(238,8,242," + (0.16 * p).toFixed(3) + "), " + SH_LIFT;
              lines.forEach((el) => { el.style.textShadow = v; });
            };

            // ---- start states
            gsap.set(scrim, { opacity: 0 });
            gsap.set(kick, { opacity: 0, letterSpacing: "0.7em", filter: "blur(8px)" });
            setTrack(tr0);
            gsap.set(allChars, { opacity: 0, filter: "blur(18px)", y: 26 });
            gsap.set(coords, { opacity: 0, y: 12, filter: "blur(6px)" });
            magenta(0);

            // ---- in: kicker tracking contracts; each line resolves from its centre out, CITY 0.1 s behind VICE
            Look.drive(tl, 0, 0.45, (p) => { scrim.style.opacity = (sc.peak * gsap.parseEase("power2.out")(p)).toFixed(3); });
            ft(kick, { opacity: 0, letterSpacing: "0.7em", filter: "blur(8px)" },
                     { opacity: 1, letterSpacing: "0.42em", filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0.06);
            lineChars.forEach((chars, li) => {
              const mid = (chars.length - 1) / 2;
              chars.forEach((c, i) => {
                const d = Math.abs(i - mid) / Math.max(mid, 1);
                ft(c, { opacity: 0, filter: "blur(18px)", y: 26 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "power3.out" }, T.heroIn + li * 0.08 + d * 0.14);
              });
            });
            tl.set(allChars, { filter: "none" }, T.heroIn + 0.74);
            // tracking settles all the way to the cut, so the stack LOCKS on the hit
            const HIT = T.cuts0[0];
            Look.drive(tl, T.heroIn, HIT - T.heroIn, (p) => setTrack(tr0 + (tr1 - tr0) * EXPO(p)));

            // ---- the payoff, on the cut to the skyline: exposure hit + shake/punch on the footage, the magenta edge snaps on
            if (plate) {
              Look.impact(tl, HIT, { shake: "#shake", amp: 10, flash: 0, zoom: 1.045 });
              // s135's sky is already pale: 1.65 blows the highlights without swallowing the white type
              Look.expose(tl, HIT, { target: "#shake", peak: 1.65, hold: 2 / 30, dur: 0.34 });
            }
            Look.drive(tl, HIT, 0.12, (p) => magenta(gsap.parseEase("power2.out")(p)));   // the edge snaps on with the light
            ft(coords, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, HIT + 0.08);
            // coords roll to a GPS fix on the hit, and re-roll briefly on every later cut (the type rides the edit)
            const rolls = [[HIT + 0.08, 0.6, 1]].concat(T.cuts0.slice(1).map((c) => [c, 0.34, 0.18]));
            rolls.forEach((r) => {
              Look.drive(tl, r[0], r[1], (p) => { if (p > 0) coords.textContent = coordText(1 - r[2] * (1 - EXPO(p)), "\n"); });
            });
            // lockup scale: punch on the hit, slow drift through the hold, a 2-frame 1.02 tick on every later cut
            const holdLen = T.out0 + 0.5 - HIT, ticks = T.cuts0.slice(1), TICK = 2 / 30;
            lock.style.transformOrigin = L.inkX + "px " + Math.round(base - LH / 2) + "px";
            Look.drive(tl, HIT, holdLen, (p) => {
              const t = p * holdLen, at = HIT + t;
              let s = p <= 0 ? 1 : 1 + 0.04 * (1 - EXPO(Math.min(1, t / 0.6))) + 0.02 * Math.max(0, (t - 0.6) / (holdLen - 0.6));
              if (p > 0 && ticks.some((c) => at >= c && at < c + TICK)) s *= 1.02;
              lock.style.transform = "scale(" + s.toFixed(4) + ")";
            });

            // ---- footage: each shot gets its own slow push
            if (plate) {
              const segs = [0].concat(T.cuts0).concat([D]);
              for (let i = 0; i < segs.length - 1; i++) Look.push(tl, "#push", segs[i], segs[i + 1] - segs[i], { from: 1.0, to: i === 1 ? 1.07 : 1.05 });
            }

            // ---- out: the stack dissolves through blur from the ink edge outward, tracking opens, scrim lifts
            const O = T.out0;
            Look.exit(tl, [coords, kick], O, { to: "blur", dur: 0.36, stagger: 0.05, blur: 10 });
            lineChars.forEach((chars, li) => chars.forEach((c, i) => {
              ft(c, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(16px)", duration: 0.36, ease: "power2.in" }, O + 0.04 + li * 0.05 + i * 0.025);
            }));
            Look.drive(tl, O + 0.04, 0.45, (p) => { if (p > 0) setTrack(tr1 + 0.1 * gsap.parseEase("power2.in")(p)); });
            Look.drive(tl, O + 0.12, 0.38, (p) => { if (p > 0) scrim.style.opacity = (sc.peak * (1 - gsap.parseEase("power2.inOut")(p))).toFixed(3); });
          } else {
            /* ======================= v1 · Pin pill ======================= */
            const L = CONFIG.layout.v1;
            const rig = $("#pinRig"), box = $("#pillBox"), pill = $("#pill"), inner = $("#pinner"), nameEl = $("#pname"), coordsEl = $("#pcoords");
            const needle = $("#needle"), tip = $("#tip"), contact = $("#contact"), edge = $("#pedge");
            rig.classList.remove("hide");
            const PW = L.pillW, PH = L.pillH, R = PH / 2;
            box.style.width = PW + "px"; box.style.height = PH + "px"; box.style.left = L.pillX + "px";
            box.style.transformOrigin = (PW / 2) + "px " + R + "px";
            pill.style.width = PW + "px"; pill.style.height = PH + "px"; pill.style.borderRadius = R + "px";
            pill.style.transformOrigin = R + "px " + R + "px";       // the pin head = the pill's left cap
            inner.style.width = PW + "px"; inner.style.height = PH + "px";

            // name: 140 px Inter 800; fit down only if a longer name would overflow the pill
            nameEl.textContent = V.name;
            const nm100 = ink(V.name, 100, '"Inter"', 800, "normal", -4.5);
            const nSize = Math.min(L.nameSize, Math.floor(100 * L.nameInkMax / (nm100.r - nm100.l)));
            nameEl.style.fontSize = nSize + "px";
            const nm = ink(V.name, nSize, '"Inter"', 800, "normal", -0.045 * nSize);
            const nameInkRight = L.pillX + (PW - nm.w) / 2 + nm.r;   // the name box is centred in the pill

            // coords: under the pill, right-aligned to the name's visible right edge
            const cStr = coordText(1, "   ");
            coordsEl.textContent = cStr;
            const cm = ink(cStr, 28, '"JetBrains Mono"', 600, "normal", 0.2 * 28);
            coordsEl.style.left = (nameInkRight - cm.r).toFixed(1) + "px";

            // tracked tip -> screen space (s075's push is mirrored here; the rig lives outside #push)
            const tr = L.track, y0 = tr[0][2], y1 = tr[tr.length - 1][2];
            const world = (t) => {
              let i = 0; while (i < tr.length - 2 && tr[i + 1][0] <= t) i++;
              const a = tr[i], b = tr[i + 1], k = Math.max(0, Math.min(1, (t - a[0]) / (b[0] - a[0])));
              const x = a[1] + (b[1] - a[1]) * k, y = a[2] + (b[2] - a[2]) * k;
              const s = 1 + L.trackZoom * (y0 - y) / (y0 - y1);
              return [x + L.anchorOffset[0] * s, y + L.anchorOffset[1] * s];
            };
            const C1 = T.cuts1[0], OPEN = T.open, PLANT = T.plant, HIT = C1, PULL = T.pull, O = T.out1;
            const tipAt = (t) => {
              const w = world(plate ? t : 0);
              const s = plate ? 1 + (L.push.to - 1) * Math.max(0, Math.min(1, t / C1)) : 1;
              return [L.push.origin[0] + (w[0] - L.push.origin[0]) * s, L.push.origin[1] + (w[1] - L.push.origin[1]) * s];
            };
            const N = tipAt(PULL)[1] - PH - L.pillTopFinal;     // needle length: the pill parks exactly at pillTopFinal
            // the plant recoil (a 7 px dip that springs back), a pure function of time so it composes with the track
            const P2 = gsap.parseEase("power2.out"), BK = gsap.parseEase("back.out(2.6)");
            const recoil = (t) => t <= PLANT ? 0 : t < PLANT + 0.06 ? 7 * P2((t - PLANT) / 0.06) : t < PLANT + 0.46 ? 7 * (1 - BK((t - PLANT - 0.06) / 0.4)) : 0;
            const layout = (t) => {
              const tp = tipAt(Math.min(t, PULL)), top = tp[1] - N - PH + recoil(t);
              box.style.top = top.toFixed(2) + "px";
              coordsEl.style.top = topForBaseline(top + PH + L.coordsGap + cm.asc, 28, cm).toFixed(2) + "px";
              needle.style.left = (tp[0] - 3).toFixed(2) + "px"; needle.style.top = (top + PH - 3).toFixed(2) + "px";
              needle.style.height = Math.max(0, tp[1] - (top + PH - 3)).toFixed(2) + "px";
              tip.style.left = tp[0].toFixed(2) + "px"; tip.style.top = tp[1].toFixed(2) + "px";
              contact.style.left = tp[0].toFixed(2) + "px"; contact.style.top = tp[1].toFixed(2) + "px";
            };
            Look.drive(tl, 0, D, (p) => layout(p * D));

            // ---- start states
            gsap.set(pill, { width: PH, scale: 0.2, opacity: 0, filter: "blur(10px)" });
            gsap.set(nameEl, { yPercent: 118 });
            gsap.set(coordsEl, { opacity: 0, y: 12, filter: "blur(6px)" });
            gsap.set(needle, { scaleY: 0 });
            gsap.set([tip, contact], { opacity: 0, scale: 0.3 });

            // ---- in: the pin head pops (the pill's left cap), unfurls into the pill, the name rises out of its mask
            ft(pill, { scale: 0.2, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.24, ease: "back.out(1.8)" }, OPEN);
            tl.set(pill, { filter: "none" }, OPEN + 0.25);
            ft(pill, { width: PH }, { width: PW, duration: 0.5, ease: "expo.out" }, OPEN + 0.1);
            ft(nameEl, { yPercent: 118 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, OPEN + 0.16);
            // ---- the needle stabs down from the pill into the roof (vertical motion blur), and plants
            ft(needle, { scaleY: 0 }, { scaleY: 1, duration: PLANT - 0.24, ease: "power3.in" }, 0.24);
            Look.mblur(tl, needle, 0.24, PLANT - 0.24, { y: 26, to: [0, 0], ease: "expo.in" });
            ft([tip, contact], { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, PLANT);
            // coords rise and roll toward a GPS fix that LOCKS on the hit
            ft(coordsEl, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, PLANT + 0.1);
            Look.drive(tl, PLANT + 0.1, HIT - PLANT - 0.1, (p) => { if (p > 0) coordsEl.textContent = coordText(p >= 1 ? 1 : 0.985 * P2(p), "   "); });

            // ---- pull the pin: the needle retracts into the pill just before the cut, the tip lifts off the roof
            ft(needle, { scaleY: 1 }, { scaleY: 0, duration: HIT - PULL - 0.02, ease: "power3.in" }, PULL);
            ft([tip, contact], { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.3, duration: 0.12, ease: "power2.in" }, PULL);

            // ---- the payoff, on the cut to the bright water: exposure hit + shake/punch, the pill punches, its lit edge flares
            if (plate) {
              Look.impact(tl, HIT, { shake: "#shake", amp: 9, flash: 0, zoom: 1.04 });
              // s064 is already high-key: a 1.85 peak clips the whole frame to white, so the light hit is scaled to the shot
              Look.expose(tl, HIT, { target: "#shake", peak: 1.38, saturate: 1.22, hold: 2 / 30, dur: 0.34 });
            }
            ft(edge, { opacity: 0.55 }, { opacity: 1, duration: 1 / 30, ease: "none" }, HIT);
            ft(edge, { opacity: 1 }, { opacity: 0.55, duration: 0.5, ease: "power2.out" }, HIT + 3 / 30);
            // the box punches on the hit, then gets a 2-frame 1.015 tick on every later cut (the pill rides the edit)
            const ticks = T.cuts1.slice(1), TICK = 2 / 30;
            Look.drive(tl, HIT, O - HIT, (p) => {
              const at = HIT + p * (O - HIT);
              let s = p <= 0 || p >= 1 ? 1 : 1 + 0.045 * (1 - EXPO(Math.min(1, (at - HIT) / 0.5)));
              if (p > 0 && p < 1 && ticks.some((c) => at >= c && at < c + TICK)) s *= 1.015;
              box.style.transform = "scale(" + s.toFixed(4) + ")";
            });
            ticks.forEach((c) => Look.drive(tl, c, 0.3, (p) => { if (p > 0) coordsEl.textContent = coordText(1 - 0.15 * (1 - EXPO(p)), "   "); }));

            // ---- footage: each shot gets its own slow push (s075's push is mirrored by tipAt)
            if (plate) {
              const segs = [0].concat(T.cuts1).concat([D]);
              for (let i = 0; i < segs.length - 1; i++) Look.push(tl, "#push", segs[i], segs[i + 1] - segs[i], { from: 1.0, to: i === 0 ? L.push.to : 1.05 });
            }

            // ---- out (as the real Keys sign rises to meet it): the text and the pill close TOGETHER into the cap, which blurs out
            ft(nameEl, { yPercent: 0 }, { yPercent: -118, duration: 0.3, ease: "power3.in" }, O);
            ft(coordsEl, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, O);
            ft(pill, { width: PW }, { width: PH, duration: 0.28, ease: "power3.in" }, O);
            ft(pill, { opacity: 1, scale: 1, filter: "blur(0px)" }, { opacity: 0, scale: 0.2, filter: "blur(10px)", duration: 0.12, ease: "power3.in" }, O + 0.22);
          }

          Look.install(tl, { duration: D, grain: 0.15, vignette: 0.5, enabled: plate });
          tl.set({}, {}, D);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
